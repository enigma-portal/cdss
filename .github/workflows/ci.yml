name: CDSS CI

on:
  pull_request:
  push:
    branches:
      - main
      - e2e-hardening-2026-10-28

permissions:
  contents: read

jobs:
  regression:
    name: Python regression and integrity-safe checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run isolated full regression suite
        run: python scripts/run_isolated_checks.py full ci-regression.log "test_*.py"

      - name: Compile Python sources
        run: python -m compileall -q app tests scripts run.py wsgi.py

      - name: Check patch whitespace
        run: git diff --check HEAD^

      - name: Upload regression log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-regression-log
          path: ci-regression.log
          if-no-files-found: ignore
