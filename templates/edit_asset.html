{% extends 'base.html' %}{% block content %}<div class="page-title"><div><span class="eyebrow">Administration</span><h1>Edit asset</h1></div><a class="secondary" href="{{ url_for('assets.index') }}">Back to assets</a></div>
<section class="setting-card asset-edit"><form method="post" class="asset-form">{% include '_asset_form.html' %}<button type="submit">Save asset</button></form><hr><h3>Delete asset</h3><p>Linked alerts and incidents become unmapped; security records are retained.</p><form method="post" action="{{ url_for('assets.delete', asset_id=asset.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Type <strong>{{ asset.asset_name }}</strong> to confirm <input name="confirmation" required></label><button class="danger-action" type="submit">Delete asset</button></form></section>{% endblock %}
