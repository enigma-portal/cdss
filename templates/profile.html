{% extends "base.html" %}
{% block content %}<div class="page-title"><div><p class="eyebrow">MY ACCOUNT</p><h2>Profile settings</h2><p>Signed in as {{ profile_user.role }} · account created {{ profile_user.created_at }}</p></div></div><div class="settings-grid"><section class="panel setting-card"><h3>Change username</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="username"><label>Username<input name="username" value="{{ profile_user.username }}" required minlength="3" maxlength="32"></label><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><button type="submit">Update username</button></form></section><section class="panel setting-card"><h3>Change password</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="password" required minlength="12" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirmation" required minlength="12" autocomplete="new-password"></label><button type="submit">Update password</button></form></section><section class="panel setting-card"><h3>Colour scheme</h3><p>Choose the view that is most comfortable for you.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="theme"><label>Theme<select name="theme"><option value="system"{% if profile_user.theme == 'system' %} selected{% endif %}>Use system default</option><option value="navy"{% if profile_user.theme == 'navy' %} selected{% endif %}>Navy / Black / Orange</option><option value="high-contrast"{% if profile_user.theme == 'high-contrast' %} selected{% endif %}>High contrast</option><option value="light"{% if profile_user.theme == 'light' %} selected{% endif %}>Light</option></select></label><button type="submit">Save colour scheme</button></form></section></div>{% endblock %}
