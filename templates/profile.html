{% extends "base.html" %}
{% block content %}<div class="page-title"><div><p class="eyebrow">MY ACCOUNT</p><h2>Profile settings</h2><p>Signed in as {{ profile_user.role }} · account created {{ profile_user.created_at }}</p></div></div><div class="settings-grid"><section class="panel setting-card"><h3>Change username</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="username"><label>Username<input name="username" value="{{ profile_user.username }}" required minlength="3" maxlength="32"></label><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><button type="submit">Update username</button></form></section><section class="panel setting-card"><h3>Change password</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="password" required minlength="12" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirmation" required minlength="12" autocomplete="new-password"></label><button type="submit">Update password</button></form></section></div>{% endblock %}
