{% extends "base.html" %}
{% block content %}<section class="auth-card panel"><p class="eyebrow">FIRST-RUN SETUP</p><h2>Create the administrator</h2><p>This account can view incidents and manage local CDSS users.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Admin username<input name="username" required minlength="3" maxlength="32" autocomplete="username"></label><label>Password<input type="password" name="password" required minlength="12" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmation" required minlength="12" autocomplete="new-password"></label><button type="submit">Create administrator</button></form><small>Use 12+ characters with upper-case, lower-case, and a number.</small></section>{% endblock %}
