{% extends "base.html" %}
{% block content %}<a class="back" href="{{ url_for('auth.users') }}">← Back to users</a><section class="auth-card panel"><p class="eyebrow">ADMINISTRATOR CONTROL</p><h2>Edit {{ edit_user.username }}</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" value="{{ edit_user.username }}" required minlength="3" maxlength="32"></label><label>Role<select name="role"><option value="analyst" {% if edit_user.role == 'analyst' %}selected{% endif %}>Analyst</option><option value="admin" {% if edit_user.role == 'admin' %}selected{% endif %}>Administrator</option></select></label><label>Reset password <small>(leave blank to keep current)</small><input type="password" name="password" minlength="12" autocomplete="new-password"></label><button type="submit">Save account</button></form></section>{% endblock %}
